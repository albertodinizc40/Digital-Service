<script>
const $=id=>document.getElementById(id);
const ICON={energy:'<path d=&quot;M13 2 4 14h7l-1 8 9-12h-7l1-8z&quot;/>',transport:'<path d=&quot;M5 17h14M6 17V9l2-4h8l2 4v8M6 13h12M8 20v-3M16 20v-3&quot;/>',buildings:'<path d=&quot;M4 21V5l6-2v18M10 21h10V9l-6-2M7 8v.5M7 12v.5M7 16v.5M14 12v.5M14 16v.5&quot;/>',waste:'<path d=&quot;M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6&quot;/>',nature:'<path d=&quot;M12 21V11M12 11c-4 0-7-3-7-7 4 0 7 3 7 7zm0 0c4 0 7-3 7-7-4 0-7 3-7 7z&quot;/>',adapt:'<path d=&quot;M12 3s6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11z&quot;/>',food:'<path d=&quot;M6 3v7a2 2 0 0 0 4 0V3M8 10v11M16 3c-2 1.5-3 3.5-3 6h6c0-2.5-1-4.5-3-6zM16 9v12&quot;/>',urban:'<path d=&quot;M3 21V4h18v17zM3 10h18M10 4v17M16 10v11&quot;/>',air:'<path d=&quot;M3 8h11a3 3 0 1 0-3-3M3 12.5h15a3 3 0 1 1-3 3M3 17h9&quot;/>'};
const ico=(k,cls)=>`<span class=&quot;ico ${k}${cls?' '+cls:''}&quot;><svg viewBox=&quot;0 0 24 24&quot;>${ICON[k]||ICON.energy}</svg></span>`;

/* ================= sectors (#26 all C40 sectors) ================= */
/* #3 / #24 / #14 — sector indicators as average year-on-year change, with a
   direction that counts as improvement and the C40 2% minimum threshold.    */
const SECTORS=[
 {k:'energy',     i:'energy',   n:'Energy',         ind:'Renewable share of municipal energy',      v:'42%',       ch:4.2, u:' pts/yr', dir:'up'},
 {k:'buildings',  i:'buildings',n:'Buildings',      ind:'Building emissions per capita',            v:'0.9 tCO2e', ch:-1.1,u:' %/yr',   dir:'down'},
 {k:'transport',  i:'transport',n:'Transport',      ind:'Public transit mode share',                v:'68%',       ch:0.8, u:' pts/yr', dir:'up'},
 {k:'waste',      i:'waste',    n:'Waste',          ind:'Solid waste sent to treatment',            v:'61%',       ch:5.6, u:' pts/yr', dir:'up'},
 {k:'food',       i:'food',     n:'Food',           ind:'No indicator reported',                    v:'—',         ch:null,u:'',        dir:'up'},
 {k:'urban',      i:'urban',    n:'Urban planning', ind:'Residents within 800 m of mass transit',   v:'54%',       ch:1.4, u:' pts/yr', dir:'up'},
 {k:'air',        i:'air',      n:'Air quality',    ind:'No indicator reported',                    v:'—',         ch:null,u:'',        dir:'down'},
 {k:'adaptation', i:'adapt',    n:'Adaptation',     ind:'Residents covered by the heat action plan',v:'38%',       ch:3.1, u:' pts/yr', dir:'up'}
];
const SN={};SECTORS.forEach(s=>SN[s.k]=s.n);
const SMAP={stationary:'energy',industry:'buildings',adapt:'adaptation',nature:'adaptation',water:'adaptation',heat:'adaptation'};
/* meets the C40 minimum: 2% change in the *right* direction */
const meetsCh=(ch,dir)=>ch===null||ch===undefined?null:(dir==='up'?ch>=2:ch<=-2);
const chgTxt=(ch,u)=>(ch>0?'+':'−')+Math.abs(ch)+(u||'');
function thresholdPill(ch,dir){const m=meetsCh(ch,dir);
  return m===null?'<span class=&quot;pill grey&quot;>Not reported</span>':m?'<span class=&quot;pill ok&quot;>Meets 2% threshold</span>':'<span class=&quot;pill warn&quot;>Below 2% threshold</span>';}
function indCard(s,onclick,sel){const m=meetsCh(s.ch,s.dir);
  const col=m===null?'':m?'c-ok':'c-warn';
  return `<div class=&quot;icard${sel?' sel':''}&quot; onclick=&quot;${onclick}&quot;>
   <div class=&quot;top&quot;>${ico(s.i)}<span class=&quot;chg ${col}&quot;>${s.ch===null?'—':chgTxt(s.ch,s.u)}</span></div>
   <div class=&quot;name&quot;>${s.n}</div>
   <div class=&quot;ind&quot;>${s.ind}${s.ch===null?'':' · now '+s.v}</div>
   <div class=&quot;foot&quot;>${thresholdPill(s.ch,s.dir)}${s.ch===null?'<span class=&quot;ind&quot;><a href=&quot;#&quot; onclick=&quot;event.stopPropagation();ext(\'Report — sector indicators\');return false&quot;>Add in Report</a></span>':`<span class=&quot;ind&quot;>improvement = ${s.dir==='up'?'increase ↑':'decrease ↓'}</span>`}</div></div>`;}


/* Climate actions = evolution: 5-year series per sector indicator */
const SERIES={energy:[21,25,30,35,39,42],buildings:[0.96,0.95,0.94,0.93,0.91,0.9],transport:[64,65,66,67,67,68],waste:[33,39,45,50,56,61],urban:[47,48,50,51,53,54],adaptation:[23,26,29,32,35,38]};
function trendCard(s,onclick,sel){const m=meetsCh(s.ch,s.dir);const col=m===null?'':m?'c-ok':'c-warn';const ser=SERIES[s.k];

.placeholder{display:flex;gap:10px;background:var(--soft);border:1px dashed #C9CDC8;border-radius:6px;padding:11px 14px;font-size:12.5px;color:var(--text);margin:10px 0 0}

.toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.toggle button{border:0;background:#fff;padding:6px 12px;font-size:12.5px;color:var(--text);font-weight:500}.toggle button.on{background:var(--green);color:#fff}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.show{opacity:1}
@media(max-width:900px){.g2,.g3,.g4,.g5,.g6,.g64,.g46,.g8{grid-template-columns:1fr 1fr}h1{font-size:30px}.tabs{display:none}}
@media(max-width:600px){.g2,.g3,.g4,.g5,.g6,.g64,.g46,.g8{grid-template-columns:1fr}.wrap{padding:0 16px}}
/* ---- public additions (same tokens) ---- */
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:280px;margin-top:10px}
.searchbox svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}.searchbox input{border:0;outline:0;font:inherit;font-size:14px;width:100%;background:transparent}
.aggc{display:flex;flex-direction:column}.aggc .k,.card .k{font-size:12.5px;color:var(--muted)}.aggc .n,.card .n{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px}.card .n .u{font-size:13px;color:var(--muted);font-weight:500}
.aggc .legend{font-size:11.5px}
.pmap{background:#E3ECEF;margin-top:14px;height:470px}.pmap #wmap,.pmap svg{display:block;width:100%;height:100%}
.pmap path.ctry{fill:#F7F6F2;stroke:#D5D9D6;stroke-width:.6;cursor:default}.pmap path.ctry.plat{fill:#DCEAE3;stroke:#B9D2C8}.pmap path.ctry:hover{stroke:#D5D9D6;stroke-width:.6}
.pmap .dot{cursor:pointer;stroke:#fff;stroke-width:2.5}.pmap .dot.on{fill:#0F6B58}.pmap .dot.off{fill:#fff;stroke:#6B7280;stroke-width:2.2}.pmap .dot:hover{stroke:#111827}
.pmap .halo{fill:rgba(15,107,88,.16);stroke:#0F6B58;stroke-width:1.2}.pmap .mlbl{font-size:12.5px;font-weight:600;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}.lg-dot.on{background:#0F6B58}.lg-dot.off{background:#fff;border:2px solid #6B7280;width:8px;height:8px}
.maplegend{flex-direction:row;gap:16px}.maplegend i{border-radius:50%}
.popcard{position:absolute;right:14px;top:14px;width:340px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(17,24,39,.12);padding:18px 20px;max-height:calc(100% - 28px);overflow:auto}
.popcard .k{font-size:12px;color:var(--muted)}.pclose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;color:var(--muted);line-height:1}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.pgrid b{font-size:14px;font-weight:600}
tr.selrow td{background:#F1F6F4}
.track.wh{background:repeating-linear-gradient(45deg,#EFEFEC,#EFEFEC 5px,#E2E3DF 5px,#E2E3DF 10px)}
.card.empty{margin-top:4px;border-style:dashed;background:#FCFCFB}
.crumb a{color:var(--muted)}.crumb a:hover{color:var(--green)}

.mapfilters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.hztoggle button{white-space:nowrap}
.pmap .dot.bub{fill:rgba(15,107,88,.78)}.pmap .dot.whd{fill:#fff;stroke:#6B7280;stroke-width:2;stroke-dasharray:3 3}.pmap .dot.rk{stroke:#fff;stroke-width:2.5}
.lg-dot.wh{background:#fff;border:1.5px dashed #6B7280;width:10px;height:10px;box-sizing:border-box}
.dv{display:grid;grid-template-columns:1fr 150px 64px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.dv:first-child{border-top:0}
.dv .v{text-align:right;font-weight:600}.dvt{position:relative;height:12px;background:#F3F4F2;border-radius:6px}.dvt .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#9CA3AF}
.dvt .bar{position:absolute;top:0;height:12px;border-radius:6px}.dvt .bar.neg{background:#1B7F4C}.dvt .bar.pos{background:#C62828}
.hrow.hl .track i{background:var(--green)}.hrow.hl{color:var(--ink);font-weight:600}
.linkcard{display:flex;flex-direction:column}.linkcard .btn{margin-top:auto}
.eacat{margin-top:12px}.eacat:first-child{margin-top:0}.eacat>b{font-size:13.5px;font-weight:600}

.aggbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:10px 14px;background:var(--soft);border-radius:6px}
.aggbar .hztoggle button{background:#fff}.aggbar .hztoggle button.on{background:var(--green);color:#fff;border-color:var(--green)}
.pmap .dot.dim{opacity:.18;cursor:default}.pmap .dot.bub{fill:rgba(15,107,88,.62);stroke-width:1.2}.pmap .dot.off{stroke-width:1.5}.pmap .dot.rk{stroke-width:1.2}.pmap .dot.whd{stroke-width:1.3}
.pmap path.ctry.plat{fill:#F7F6F2;stroke:#D5D9D6}

.pmap #wmap{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.pmap #wmap.grabbing{cursor:grabbing}
.pmap .dot:not(.dim){cursor:pointer}.pmap .dot.dim{pointer-events:auto}
.zoom.zl{right:auto;left:12px}.zoom button{cursor:pointer}.zoom button:hover{border-color:#CBD5D1;color:var(--green)}
.pmap .mlbl.sm{font-size:10.5px;font-weight:500;fill:#374151;stroke-width:2.5px}
</style>
</head>

  adapt:{inland:'Flood early warning network'}}

const byId=id=>CITIES.find(c=>c.id===id);

/* ================= aggregates ================= */
let SEL=new Set(),HZSEL='heat',SELCITY=null,LAYER='em',SECF='all',HZON=new Set(['heat']);
const SECN=['Stationary energy','Transport','Waste','Industrial processes'];
GEN.forEach((g,i)=>CITIES.push({id:'g'+i,gen:true,n:g[0],c:g[1],reg:g[2],lat:g[3],lon:g[4],rel:!!g[5],em:g[6],pc:g[7],sectors:SECN.map((n,k)=>[n,g[8][k]]),hz:g[9],badge:g[10],mem:g[11],c40:g[11].includes('C40'),chg:g[12],year:g[13]}));
const secVal=c=>SECF==='all'?c.em:c.sectors[+SECF][1];
const inReg=c=>SEL.size===0||SEL.has(c.reg);

function stackBar(parts,tot){return `<div class=&quot;stack&quot; style=&quot;height:12px;margin-top:14px&quot;>${parts.map(([n,v,c])=>`<i style=&quot;width:${tot?v/tot*100:0}%;background:${c}&quot; title=&quot;${n}: ${v}&quot;></i>`).join('')}</div><div class=&quot;legend&quot; style=&quot;flex-wrap:wrap;gap:6px 14px&quot;>${parts.map(([n,v,c])=>`<span><i style=&quot;background:${c}&quot;></i>${n} <b style=&quot;color:var(--ink)&quot;>${v}</b></span>`).join('')}</div>`;}
function setAgg(k){if(k==='global')SEL.clear();else{SEL.has(k)?SEL.delete(k):SEL.add(k);if(SEL.size===Object.keys(REG).length)SEL.clear();}
  if(SELCITY&amp;&amp;!inReg(byId(SELCITY)))closePop(true);drawAggBar();drawAgg();fitView();drawMap();drawList();}
function drawAggBar(){$('aggreg').innerHTML=`<button class=&quot;${SEL.size===0?'on':''}&quot; onclick=&quot;setAgg('global')&quot;>Global</button>`+Object.keys(REG).map(k=>`<button class=&quot;${SEL.has(k)?'on':''}&quot; onclick=&quot;setAgg('${k}')&quot;>${SEL.has(k)?'✓ ':''}${REG[k].n}</button>`).join('');}
function drawAgg(){const C=CITIES.filter(inReg),R=C.filter(c=>c.rel);const RV=R.filter(c=>secVal(c)!==null),wh=R.length-RV.length;const tot=RV.reduce((a,c)=>a+secVal(c),0);
  const withHz=R.filter(c=>c.hz&amp;&amp;c.hz[HZSEL]);const cnt=l=>withHz.filter(c=>c.hz[HZSEL]===l).length;
  const b=l=>C.filter(c=>c.badge===l).length;const regs=SEL.size===1?null:Object.keys(REG).filter(k=>SEL.size===0||SEL.has(k));
  const emParts=regs?regs.map(k=>[REG[k].s,Math.round(RV.filter(c=>c.reg===k).reduce((a,c)=>a+secVal(c),0)),REGC[k]])
    :SECN.map((n,i)=>[n,Math.round(RV.reduce((a,c)=>a+(c.sectors[i][1]||0),0)),['#0F6B58','#7FB3A8','#B8860B','#C9C4B8'][i]]);
  $('agg').innerHTML=`
   <div class=&quot;card aggc&quot;><div class=&quot;k&quot;>Emissions released${SECF==='all'?'':' · '+SECN[+SECF]}</div><div class=&quot;n&quot;>${fmtN(tot)} <span class=&quot;u&quot;>CO2e</span></div><div class=&quot;note&quot; style=&quot;margin-top:4px&quot;>Released by <b>${RV.length} of ${C.length}</b> reporting cities${wh?` · ${wh} withheld`:''}</div>${stackBar(SECF!=='all'&amp;&amp;!regs?[[SECN[+SECF],Math.round(tot),'#0F6B58']]:emParts,SECF!=='all'&amp;&amp;!regs?tot:emParts.reduce((a,p)=>a+p[1],0))}</div>
   <div class=&quot;card aggc&quot;><div class=&quot;k&quot;>Cities reporting in 2027</div><div class=&quot;n&quot;>${C.length} <span class=&quot;u&quot;>cities</span></div><div class=&quot;note&quot; style=&quot;margin-top:4px&quot;>${R.length} released a public report · ${C.length-R.length} no public report yet</div>${stackBar([['Public report',R.length,'var(--green)'],['No public report yet',C.length-R.length,'#DBDDD8']],C.length)}</div>
   <div class=&quot;card aggc&quot;><div style=&quot;display:flex;justify-content:space-between;align-items:flex-start;gap:8px&quot;><div class=&quot;k&quot;>Cities at risk</div><select class=&quot;dd&quot; style=&quot;padding:3px 24px 3px 8px;font-size:12px&quot; onchange=&quot;HZSEL=this.value;drawAgg()&quot;>${['heat','coastal','inland','drought','landslide'].map(k=>`<option value=&quot;${k}&quot;${k===HZSEL?' selected':''}>${HZN[k]}</option>`).join('')}</select></div><div class=&quot;n&quot;>${cnt('High')} <span class=&quot;u&quot;>at high risk</span></div><div class=&quot;note&quot; style=&quot;margin-top:4px&quot;>Of <b>${withHz.length}</b> cities that released an assessment of this hazard</div>${stackBar([['High',cnt('High'),'#C62828'],['Moderate',cnt('Moderate'),'#B8860B'],['Low',cnt('Low'),'#1B7F4C']],withHz.length)}</div>

/* ================= map ================= */
let MW=1000;const MH=470;let VIEW={cx:5,cy:10,w:350,h:133};
function fitView(){const C=CITIES.filter(inReg);if(SEL.size===0){VIEW={cx:5,cy:10,w:350,h:133};return;}
  let x0=Math.min(...C.map(c=>c.lon)),x1=Math.max(...C.map(c=>c.lon)),y0=Math.min(...C.map(c=>c.lat)),y1=Math.max(...C.map(c=>c.lat));
  const px=Math.max(6,(x1-x0)*0.12),py=Math.max(5,(y1-y0)*0.15);VIEW={cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.min(360,x1-x0+2*px),h:Math.min(140,y1-y0+2*py)};}
function clampView(){VIEW.w=Math.min(360,Math.max(3,VIEW.w));VIEW.h=Math.min(140,Math.max(1.5,VIEW.h));VIEW.cx=Math.max(-180,Math.min(180,VIEW.cx));VIEW.cy=Math.max(-58,Math.min(78,VIEW.cy));}
function zoomAt(f,px,py){const [s]=proj();const lon=VIEW.cx+(px-MW/2)/s,lat=VIEW.cy-(py-MH/2)/s;VIEW.w*=f;VIEW.h*=f;clampView();const [s2]=proj();VIEW.cx=lon-(px-MW/2)/s2;VIEW.cy=lat+(py-MH/2)/s2;clampView();drawMap();}
function zoom(f){zoomAt(f,MW/2,MH/2);}
function resetView(){fitView();drawMap();}
/* ---- mouse / touch navigation: drag to move, wheel or double-click to zoom ---- */
let DRAG=null,DRAGGED=false,RAF=0;
function dotClick(id){if(DRAGGED)return;openPop(id);}
function redraw(){if(RAF)return;RAF=requestAnimationFrame(()=>{RAF=0;drawMap();});}
function initMapNav(){const w=$('wmap');
  w.addEventListener('pointerdown',e=>{if(e.button!==0)return;DRAG={x:e.clientX,y:e.clientY,cx:VIEW.cx,cy:VIEW.cy,moved:false};DRAGGED=false;});
  window.addEventListener('pointermove',e=>{if(!DRAG)return;const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
    if(!DRAG.moved&amp;&amp;Math.hypot(dx,dy)<4)return;DRAG.moved=true;w.classList.add('grabbing');const [s]=proj();VIEW.cx=DRAG.cx-dx/s;VIEW.cy=DRAG.cy+dy/s;clampView();redraw();});
  window.addEventListener('pointerup',()=>{if(!DRAG)return;DRAGGED=DRAG.moved;DRAG=null;w.classList.remove('grabbing');setTimeout(()=>{DRAGGED=false;},0);});
  w.addEventListener('wheel',e=>{e.preventDefault();const r=w.getBoundingClientRect();zoomAt(e.deltaY>0?1.25:0.8,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  w.addEventListener('dblclick',e=>{const r=w.getBoundingClientRect();zoomAt(e.shiftKey?1.8:0.55,e.clientX-r.left,e.clientY-r.top);});
  w.addEventListener('click',e=>{if(DRAGGED)return;if(e.target.tagName!=='circle'&amp;&amp;SELCITY)closePop();});}
function proj(){const s=Math.min(MW/VIEW.w,MH/VIEW.h);return [s,lon=>MW/2+(lon-VIEW.cx)*s,lat=>MH/2-(lat-VIEW.cy)*s];}
function setLayer(l,b){LAYER=l;if(b)b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawFilters();drawMap();}
function setSecF(v){SECF=v;drawFilters();drawAgg();drawMap();}
function toggleHz(k){if(HZON.has(k)){if(HZON.size>1)HZON.delete(k);}else HZON.add(k);drawFilters();drawMap();}
function drawFilters(){$('flt-label').textContent=LAYER==='em'?'Sector':'Risk layers';
  $('filters').innerHTML=LAYER==='em'?[['all','All sectors']].concat(SECN.map((n,i)=>[String(i),n])).map(([k,n])=>`<button class=&quot;${SECF===k?'on':''}&quot; onclick=&quot;setSecF('${k}')&quot;>${n}</button>`).join('')
   :Object.keys(HZN).map(k=>`<button class=&quot;${HZON.has(k)?'on':''}&quot; onclick=&quot;toggleHz('${k}')&quot;>${HZON.has(k)?'✓ ':''}${HZN[k]}</button>`).join('');
  $('mlegend').innerHTML=LAYER==='em'?`<span><i class=&quot;lg-dot on&quot; style=&quot;opacity:.8&quot;></i>Circle size = emissions released</span><span><i class=&quot;lg-dot wh&quot;></i>Withheld</span><span><i class=&quot;lg-dot off&quot;></i>No public report yet</span>`
   :`<span><i class=&quot;lg-dot&quot; style=&quot;background:#C62828&quot;></i>High</span><span><i class=&quot;lg-dot&quot; style=&quot;background:#B8860B&quot;></i>Moderate</span><span><i class=&quot;lg-dot&quot; style=&quot;background:#1B7F4C&quot;></i>Low</span><span><i class=&quot;lg-dot&quot; style=&quot;background:#C9CDC8&quot;></i>Not assessed</span><span><i class=&quot;lg-dot off&quot;></i>No public report yet</span>`;}
const LVORD={High:3,Moderate:2,Low:1};
function riskOf(c){let best=null;HZON.forEach(k=>{const l=c.hz&amp;&amp;c.hz[k];if(l&amp;&amp;(!best||LVORD[l]>LVORD[best]))best=l;});return best;}
function drawMap(){MW=Math.round($('mapwrap').clientWidth)||1000;const [s,X,Y]=proj();const on=new Set(['BRA','PHL']);
  let o=`<svg viewBox=&quot;0 0 ${MW} ${MH}&quot;>`;
  WORLD.forEach(([iso,rings])=>{let d='';rings.forEach(r=>{d+='M';for(let i=0;i<r.length;i+=2)d+=(i?'L':'')+X(r[i]/10).toFixed(1)+' '+Y(r[i+1]/10).toFixed(1);d+='Z';});o+=`<path class=&quot;ctry&quot; d=&quot;${d}&quot;/>`;});
  const z=Math.min(2.2,Math.max(1,Math.sqrt(s/3.2))),base=LAYER==='em'?1:1;
  const order=[...CITIES].sort((a,b)=>(inReg(a)-inReg(b))||((b.rel?secVal(b)||0:0)-(a.rel?secVal(a)||0:0)));
  order.forEach(c=>{const x=X(c.lon),y=Y(c.lat);if(x<-40||x>MW+40||y<-40||y>MH+40)return;const sel=c.id===SELCITY,act=inReg(c);let r=2.8*z,cls='dot',tip=c.n,fill='';
    if(!act)cls+=' dim';

    else if(LAYER==='em'){const v=secVal(c);if(v===null){cls+=' whd';r=3.4*z;tip+=' · withheld';}else{r=(1.6+Math.sqrt(v)*0.85)*z;cls+=' bub';tip+=` · ${v.toFixed(1)} Mt CO2e`;}}
    else{const l=riskOf(c);fill=l?{High:'#C62828',Moderate:'#B8860B',Low:'#1B7F4C'}[l]:'#C9CDC8';r=3.2*z;cls+=' rk';tip+=' · '+(l||'not assessed');}
    c._r=r;if(sel)o+=`<circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;${r+6}&quot; class=&quot;halo&quot;/>`;
    o+=`<circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;${r.toFixed(1)}&quot; class=&quot;${cls}&quot; ${fill?`style=&quot;fill:${fill}&quot;`:''} ${act?`onclick=&quot;dotClick('${c.id}')&quot;`:''}><title>${act?tip:tip+' · outside the selected regions'}</title></circle>`;});
  if(s>=26)CITIES.filter(c=>c.gen&amp;&amp;inReg(c)).forEach(c=>{const x=X(c.lon),y=Y(c.lat);if(x<0||x>MW||y<0||y>MH)return;o+=`<text x=&quot;${x+(c._r||4)+4}&quot; y=&quot;${y+4}&quot; class=&quot;mlbl sm&quot;>${c.n}</text>`;});
  if(s>9)CITIES.filter(c=>!c.gen&amp;&amp;inReg(c)).forEach(c=>{const x=X(c.lon),y=Y(c.lat);if(x<-40||x>MW+40||y<-40||y>MH+40)return;const off=(c._r||7)+5,ty=y+4+(c.dy||0);o+=c.lab==='l'?`<text x=&quot;${x-off}&quot; y=&quot;${ty}&quot; class=&quot;mlbl&quot; text-anchor=&quot;end&quot;>${c.n}</text>`:`<text x=&quot;${x+off}&quot; y=&quot;${ty}&quot; class=&quot;mlbl&quot;>${c.n}</text>`;});
  $('wmap').innerHTML=o+'</svg>';
  $('map-sub').textContent=`${CITIES.filter(inReg).length} cities · ${selName()} · drag to move, scroll or double-click to zoom, click a city for its summary`;}

/* ================= summary card (pop-up) ================= */
function badgePill(b){return `<span class=&quot;pill ${b==='Committed'?'grey':'ok'}&quot;>GCoM ${b}</span>`;}
function memPills(c){return c.mem.map(m=>`<span class=&quot;pill grey&quot;>${m}</span>`).join(' ');}

function openPop(id){SELCITY=id;const c=byId(id);MW=Math.round($('mapwrap').clientWidth)||1000;{const [s,X]=proj();const free=MW-380;if(X(c.lon)>free-40||X(c.lon)<40)VIEW.cx=c.lon-(free/2-MW/2)/s;}

   <div class=&quot;pgrid&quot;><div><div class=&quot;k&quot;>Total emissions</div><b>${c.em} Mt CO2e</b></div><div><div class=&quot;k&quot;>Per capita</div><b>${c.pc.toFixed(1)} t / person</b></div>${c.gen?`<div><div class=&quot;k&quot;>Change since baseline</div><b>${c.chg<0?'−':'+'}${Math.abs(c.chg)}%</b></div><div><div class=&quot;k&quot;>Region</div><b>${REG[c.reg].n}</b></div>`:`<div><div class=&quot;k&quot;>Target</div><b>${c.target}</b></div><div><div class=&quot;k&quot;>2030 milestone</div><b>${c.interim}</b></div>`}</div>
   <div class=&quot;k&quot; style=&quot;margin-top:12px&quot;>High-priority hazards</div><div style=&quot;margin-top:4px&quot;>${Object.keys(c.hz||{}).length?(topHz(c).map(n=>`<span class=&quot;grp&quot;>${n}</span>`).join('')||'<span class=&quot;note&quot;>None rated high</span>'):'<span class=&quot;note&quot;>No risk assessment released</span>'}</div>
   ${c.acts?`<div class=&quot;k&quot; style=&quot;margin-top:10px&quot;>Climate actions reported</div><b style=&quot;font-size:14px&quot;>${c.acts.length} actions · ${c.acts.filter(a=>a[2]).length} high-impact</b>`:''}
   ${c.gen?`<button class=&quot;btn outline&quot; style=&quot;width:100%;margin-top:16px&quot; onclick=&quot;toast('In this wireframe, full profiles are built for 6 example cities')&quot;>View city profile →</button><p class=&quot;note&quot; style=&quot;margin:8px 0 0&quot;>Illustrative figures · full profiles are built for 6 example cities</p>`:`<button class=&quot;btn primary&quot; style=&quot;width:100%;margin-top:16px&quot; onclick=&quot;openProfile('${c.id}')&quot;>View city profile →</button>`}`;}
  else{h+=`<div class=&quot;dataline&quot; style=&quot;margin:0 0 12px;padding:8px 10px&quot;><span class=&quot;pill grey&quot;>No public report yet</span></div>
   ${c.gen?'':`<div class=&quot;pgrid&quot;><div><div class=&quot;k&quot;>Commitment</div><b>${c.target}</b></div><div><div class=&quot;k&quot;>2030 milestone</div><b>${c.interim}</b></div></div>`}
   <p class=&quot;note&quot; style=&quot;margin-top:12px&quot;>${c.n} has not released a report. Its registry data, commitments and badges are shown; no estimate is shown in place of a report.</p>
   <button class=&quot;btn outline&quot; style=&quot;width:100%;margin-top:12px&quot; onclick=&quot;${c.gen?`toast('In this wireframe, full profiles are built for 6 example cities')`:`openProfile('${c.id}')`}&quot;>View city profile →</button>`;}
  $('pop').innerHTML=h;$('pop').style.display='block';drawMap();drawList();}
function closePop(q){SELCITY=null;$('pop').style.display='none';if(!q){drawMap();drawList();}}
function pickSearch(v,soft){const c=CITIES.find(x=>x.n.toLowerCase()===v.trim().toLowerCase());if(!c){if(!soft&amp;&amp;v.trim())toast('No city called &quot;'+v+'&quot; on the platform yet');return;}$('q').blur();if(!inReg(c)){SEL.clear();drawAggBar();drawAgg();}fitView();VIEW={cx:c.lon,cy:c.lat,w:Math.min(VIEW.w,40),h:Math.min(VIEW.h,22)};openPop(c.id);}

/* ================= profile charts ================= */
function trajChart(c){const W=700,H=270,pl=46,pr=112,pt=22,pb=26;const pts=c.series.filter(p=>p[1]!==null);
  const y0=c.series[0][0],y1=2030;const vmax=Math.max(...pts.map(p=>p[1]))*1.08,vmin=Math.min(c.t30,...pts.map(p=>p[1]))*0.8;
  const xs=y=>pl+(y-y0)/(y1-y0)*(W-pl-pr),ys=v=>pt+(1-(v-vmin)/(vmax-vmin))*(H-pt-pb);
  let s=`<svg class=&quot;chart&quot; viewBox=&quot;0 0 ${W} ${H}&quot;>`;const rg=vmax-vmin,step=rg>30?10:rg>12?5:rg>5?2:1;
  for(let t=Math.ceil(vmin/step)*step;t<=vmax;t+=step)s+=`<line x1=&quot;${pl}&quot; x2=&quot;${W-pr}&quot; y1=&quot;${ys(t)}&quot; y2=&quot;${ys(t)}&quot; stroke=&quot;#EEEFEC&quot;/><text x=&quot;${pl-8}&quot; y=&quot;${ys(t)+4}&quot; font-size=&quot;11&quot; fill=&quot;#9CA3AF&quot; text-anchor=&quot;end&quot;>${t}</text>`;
  [...new Set([y0,y0+Math.round((2030-y0)/3),y0+Math.round(2*(2030-y0)/3),2030])].forEach(y=>s+=`<text x=&quot;${xs(y)}&quot; y=&quot;${H-6}&quot; font-size=&quot;11&quot; fill=&quot;#9CA3AF&quot; text-anchor=&quot;middle&quot;>${y}</text>`);
  let seg=[],segs=[];c.series.forEach(p=>{if(p[1]===null){if(seg.length)segs.push(seg);seg=[];}else seg.push(p);});if(seg.length)segs.push(seg);
  segs.forEach(g=>{s+=`<polyline points=&quot;${g.map(p=>xs(p[0])+','+ys(p[1])).join(' ')}&quot; fill=&quot;none&quot; stroke=&quot;#0F6B58&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/>`;if(g.length===1)s+=`<circle cx=&quot;${xs(g[0][0])}&quot; cy=&quot;${ys(g[0][1])}&quot; r=&quot;3&quot; fill=&quot;#0F6B58&quot;/>`;});
  c.series.forEach((p,i)=>{if(p[1]===null){const a=c.series[i-1],b=c.series[i+1];if(a&amp;&amp;b&amp;&amp;a[1]!==null&amp;&amp;b[1]!==null){s+=`<line x1=&quot;${xs(a[0])}&quot; y1=&quot;${ys(a[1])}&quot; x2=&quot;${xs(b[0])}&quot; y2=&quot;${ys(b[1])}&quot; stroke=&quot;#9CA3AF&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;1 4&quot;/><text x=&quot;${xs(p[0])}&quot; y=&quot;${Math.min(ys(a[1]),ys(b[1]))-10}&quot; font-size=&quot;10&quot; fill=&quot;#6B7280&quot; text-anchor=&quot;middle&quot;>${p[0]} not reported</text>`;}}});
  const last=pts[pts.length-1];
  s+=`<line x1=&quot;${xs(last[0])}&quot; y1=&quot;${ys(last[1])}&quot; x2=&quot;${xs(2030)}&quot; y2=&quot;${ys(c.t30)}&quot; stroke=&quot;#0F6B58&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;2 4&quot;/>`;
  s+=`<rect x=&quot;${xs(last[0])-4}&quot; y=&quot;${ys(last[1])-4}&quot; width=&quot;8&quot; height=&quot;8&quot; fill=&quot;#0F6B58&quot;/><circle cx=&quot;${xs(2030)}&quot; cy=&quot;${ys(c.t30)}&quot; r=&quot;4.5&quot; fill=&quot;#fff&quot; stroke=&quot;#0F6B58&quot; stroke-width=&quot;2&quot;/>`;
  s+=`<text x=&quot;${xs(pts[0][0])}&quot; y=&quot;${ys(pts[0][1])-9}&quot; font-size=&quot;11&quot; fill=&quot;#6B7280&quot;>${pts[0][1]} Mt (${pts[0][0]})</text><text x=&quot;${xs(last[0])-6}&quot; y=&quot;${ys(last[1])-11}&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#111827&quot; text-anchor=&quot;end&quot;>${last[1]} Mt</text><text x=&quot;${xs(2030)+9}&quot; y=&quot;${ys(c.t30)+4}&quot; font-size=&quot;11&quot; fill=&quot;#0F6B58&quot; font-weight=&quot;600&quot;>${c.t30} Mt (2030 target)</text>`;
  return s+'</svg>';}
function sectorBars(c,top){const mx=Math.max(...c.sectors.map(s=>s[1]||0))*1.08;
  return [...c.sectors].sort((a,b)=>(b[1]===null?-1:b[1])-(a[1]===null?-1:a[1])).map(([n,v])=>`<div class=&quot;hrow${top&amp;&amp;n===top[0]?' hl':''}&quot; style=&quot;grid-template-columns:140px 1fr 70px&quot;><span>${n}</span>${v===null?'<div class=&quot;track wh&quot;></div><span class=&quot;v&quot;><span class=&quot;pill grey&quot;>Withheld</span></span>':`<div class=&quot;track&quot;><i style=&quot;width:${v/mx*100}%&quot;></i></div><span class=&quot;v&quot;>${v.toFixed(1)}</span>`}</div>`).join('');}
const STC={Achieving:['ok','#1B7F4C'],Progressing:['warn','#B8860B'],Basic:['grey','#9CA3AF']};
function actionsBySector(c){const mx=Math.max(...SEC.map(s=>c.acts.filter(a=>a[1]===s).length),1);
  return SEC.map(s=>{const as=c.acts.filter(a=>a[1]===s);if(!as.length)return `<div class=&quot;hrow&quot; style=&quot;grid-template-columns:100px 1fr 28px;color:var(--muted)&quot;><span>${s}</span><div class=&quot;stack&quot;></div><span class=&quot;v&quot;>0</span></div>`;
    return `<div class=&quot;hrow&quot; style=&quot;grid-template-columns:100px 1fr 28px&quot;><span>${s}</span><div class=&quot;stack&quot;><i style=&quot;width:${as.length/mx*100}%;background:#7FB3A8&quot;></i></div><span class=&quot;v&quot;>${as.length}</span></div>`;}).join('');}

/* ================= profile ================= */
function openProfile(id){const c=byId(id);SELCITY=id;
  const head=`<div class=&quot;crumb&quot;><a href=&quot;#&quot; onclick=&quot;home();return false&quot;>Cities</a> <span>›</span> ${c.c} <span>›</span> <b>${c.n}</b></div>
   <a class=&quot;back&quot; href=&quot;#&quot; onclick=&quot;home();return false&quot;>← Back to the map</a>
   <div class=&quot;headrow&quot;><div><h1>${c.n}</h1><p class=&quot;lead&quot;>What ${c.n} has committed to, reported and released.</p></div>
   <div style=&quot;display:flex;gap:8px;flex-direction:column;align-items:flex-end;padding-top:6px&quot;><span class=&quot;locpill&quot;>⌖ ${c.n}, ${c.c}</span><span style=&quot;display:flex;gap:6px&quot;>${memPills(c)} ${badgePill(c.badge)}</span></div></div>`;
  const journey=`<div class=&quot;card&quot;><h3>GCoM badge</h3><p class=&quot;sub&quot;>Badges earned from approved reports</p>${['Committed','Bronze','Silver','Gold'].map(b=>`<div class=&quot;srow&quot;>${b} ${c.bdg[b]?`<span class=&quot;pill ok&quot;>Earned · ${c.bdg[b]}</span>`:'<span class=&quot;pill grey&quot;>Not yet earned</span>'}</div>`).join('')}</div>`;
  const commit=`<div class=&quot;card&quot;><h3>Commitments</h3><p class=&quot;sub&quot;>From the city registry</p><div class=&quot;srow&quot;>Climate target <b>${c.target}</b></div><div class=&quot;srow&quot;>2030 milestone <b>${c.interim}</b></div><div class=&quot;srow&quot;>Memberships <b>${c.since}</b></div></div>`;
  if(!c.rel){$('prof').innerHTML=head+`<div class=&quot;dataline&quot; style=&quot;margin-top:22px&quot;><span class=&quot;pill grey&quot;>No public report yet</span><span>Registry data, commitments and badges only</span></div>
    <div class=&quot;card empty&quot;><h3>${c.n} has not released a report yet</h3><p style=&quot;margin:6px 0 0;color:var(--text);font-size:14px;max-width:70ch&quot;>When ${c.n} releases an approved report, its emissions, climate risks and climate actions will appear here. Nothing is estimated in its place: this page shows only what the city has said.</p></div>
    <div class=&quot;grid g2&quot; style=&quot;margin-top:18px&quot;>${commit}${journey}</div>
    <div class=&quot;bottombar&quot;><button class=&quot;btn outline big&quot; onclick=&quot;toast('Copy the stable link to this profile (simulated)')&quot;>Copy link</button></div>`;go('p1');return;}
  const b0=c.series.find(p=>p[1]!==null),ch=Math.round((c.em-b0[1])/b0[1]*100);
  const hz=Object.entries(c.hz).sort((a,b)=>LV[b[1]].v-LV[a[1]].v);
  const known=c.sectors.filter(s=>s[1]!==null),kt=known.reduce((a,s)=>a+s[1],0),top=[...known].sort((a,b)=>b[1]-a[1])[0];
  const adaptN=c.acts.filter(a=>a[1]==='Adaptation').length;
  $('prof').innerHTML=head+`
   <div class=&quot;dataline&quot; style=&quot;margin-top:22px&quot;><span class=&quot;pill ok&quot;>Approved</span><span class=&quot;pill grey&quot;>Released</span><span>Report <b>${c.year}</b> · approved ${c.appr} · ${c.carried}</span><span style=&quot;margin-left:auto&quot;>Figures as the city released them</span></div>
   <div class=&quot;grid g4&quot;>
    <div class=&quot;card&quot;><div class=&quot;k&quot;>Total emissions, ${c.year}</div><div class=&quot;n&quot;>${c.em} <span class=&quot;u&quot;>Mt CO2e</span></div></div>
    <div class=&quot;card&quot;><div class=&quot;k&quot;>Per capita</div><div class=&quot;n&quot;>${c.pc.toFixed(1)} <span class=&quot;u&quot;>tCO2e / person</span></div></div>
    <div class=&quot;card&quot;><div class=&quot;k&quot;>Change since ${b0[0]} · plan baseline</div><div class=&quot;n ${ch<0?'c-ok':'c-bad'}&quot;>${ch<0?'−':'+'}${Math.abs(ch)}%</div></div>
    <div class=&quot;card&quot;><div class=&quot;k&quot;>Climate target</div><div class=&quot;n&quot; style=&quot;font-size:20px&quot;>${c.target}</div><div class=&quot;note&quot; style=&quot;margin-top:4px&quot;>2030 milestone · ${c.interim}</div></div>
   </div>

   <h2>Emissions</h2>
   <div class=&quot;grid g64&quot;>
    <div class=&quot;card&quot;><h3>Emissions against the plan's target</h3><p class=&quot;sub&quot;>Reported emissions, Mt CO2e, and the path to the city's 2030 milestone</p>${trajChart(c)}
     <div class=&quot;legend&quot;><span><i style=&quot;background:#0F6B58;height:3px;width:16px;vertical-align:3px&quot;></i>Reported</span><span><i style=&quot;border-top:2px dotted #0F6B58;background:none;height:0;width:16px;vertical-align:3px&quot;></i>Path to target</span>${c.series.some(p=>p[1]===null)?'<span><i style=&quot;border-top:2px dotted #9CA3AF;background:none;height:0;width:16px;vertical-align:3px&quot;></i>Year not reported</span>':''}</div></div>
    <div class=&quot;card&quot;><h3>Top emitting sectors, ${c.year}</h3><p class=&quot;sub&quot;>Mt CO2e · where most emissions come from</p>${sectorBars(c,top)}
     <div class=&quot;callout&quot; style=&quot;margin-top:14px;padding:12px 14px;border-left-color:var(--green);background:#F1F6F4;border-color:#DCEAE3&quot;><div><b>${top[0]} is the largest source</b><p>${Math.round(top[1]/kt*100)}% of reported emissions · the biggest opportunity for climate finance</p></div></div>
     ${c.sectors.some(s=>s[1]===null)?'<div class=&quot;note&quot;>A value marked <b>Withheld</b> is confidential. It is not shown and is never counted as zero.</div>':''}</div>
   </div>
   <div class=&quot;grid g2&quot; style=&quot;margin-top:18px&quot;>
    <div class=&quot;card&quot;><h3>Which sectors are improving</h3><p class=&quot;sub&quot;>Change in each sector since ${b0[0]} · best and worst performing</p>${sectorChange(c)}</div>
    <div class=&quot;card&quot;><h3>Compared with the region</h3><p class=&quot;sub&quot;>Where ${c.n} sits among cities in ${REG[c.reg].n} · no city is named</p>${benchmark(c)}</div>
   </div>

   <h2>Climate risks</h2>
   <div class=&quot;grid g64&quot;>
    <div class=&quot;card&quot;><h3>Priority hazards</h3><p class=&quot;sub&quot;>From the city's released risk assessment</p>${hz.map(([k,l])=>`<div class=&quot;hz&quot;><div class=&quot;t&quot;><span>${HZN[k]}</span><b class=&quot;c-${LV[l].c}&quot;>${l}</b></div><div class=&quot;bar b-${LV[l].c}&quot;><i style=&quot;width:${LV[l].v*100}%&quot;></i></div></div>`).join('')}
     <div class=&quot;note&quot;>Risk by area within the city is shown only where the city's assessment includes it.</div></div>
    <div class=&quot;card linkcard&quot;><h3>What is ${c.n} doing about it?</h3><p class=&quot;sub&quot;>${adaptN} adaptation actions reported</p>
     <div class=&quot;vlist&quot; style=&quot;margin-bottom:16px&quot;>${hz.filter(([k,l])=>l!=='Low').map(([k,l])=>{const n=c.adapt[k]?1:0;return `<div class=&quot;row&quot;><span class=&quot;vico ${n?'ok':l==='High'?'bad':'warn'}&quot;>${n?'✓':'!'}</span><div><b>${HZN[k]}</b><small>${l} priority · ${n?n+' action reported':'no action reported yet'}</small></div></div>`;}).join('')}</div>
     <button class=&quot;btn soft&quot; onclick=&quot;toast('Opens the climate action dashboard · adaptation (simulated)')&quot;>See what ${c.n} is doing to increase resilience →</button></div>
   </div>

   <h2>Climate actions</h2>
   <div class=&quot;card&quot;>
    <div style=&quot;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap&quot;>
     <div><h3>Actions reported</h3><p class=&quot;sub&quot; style=&quot;margin-bottom:6px&quot;>Number of climate actions the city reported, by sector</p><div style=&quot;display:flex;align-items:baseline;gap:8px&quot;><span style=&quot;font-size:36px;font-weight:700;letter-spacing:-.02em&quot;>${c.acts.length}</span><span style=&quot;color:var(--text)&quot;>actions · ${c.acts.filter(a=>a[2]).length} high-impact</span></div></div>
     <div style=&quot;flex:1;min-width:320px;max-width:560px&quot;>${actionsBySector(c)}</div>
    </div>
    <div style=&quot;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)&quot;><span class=&quot;note&quot; style=&quot;margin:0&quot;>Status, impact and finance of each action are shown in the climate action dashboard.</span><button class=&quot;btn primary&quot; onclick=&quot;toast('Opens the climate action dashboard · mitigation (simulated)')&quot;>See what ${c.n} is doing to cut emissions →</button></div>
   </div>

   <h2>Energy access</h2>
   <div class=&quot;card&quot;><div style=&quot;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap&quot;><div><h3>Energy access indicators</h3><p class=&quot;sub&quot; style=&quot;margin:0&quot;>Indicators the city reported, by category</p></div><div class=&quot;hztoggle&quot; id=&quot;ea-f&quot; style=&quot;margin:0&quot;></div></div><div id=&quot;ea-list&quot; style=&quot;margin-top:12px&quot;></div></div>

   <h2>Commitments and badges</h2>
   <div class=&quot;grid g2&quot;>${commit}${journey}</div>

   <div class=&quot;bottombar&quot;><button class=&quot;btn primary big&quot; onclick=&quot;toast('PDF of this profile · city, version and date on every page (simulated)')&quot;>Download PDF</button><button class=&quot;btn primary big&quot; onclick=&quot;toast('CSV of the released figures (simulated)')&quot;>Download CSV</button><button class=&quot;btn outline big&quot; onclick=&quot;toast('Copy the stable link to this profile (simulated)')&quot;>Copy link</button></div>
   <p class=&quot;barnote&quot;>Figures as released by ${c.n} in its approved ${c.year} report. Gaps are years the city did not report; withheld values are confidential.</p>`;
  EACITY=c;setEA('all');go('p1');}
/* ---- energy access by category ---- */
let EACITY=null;const EAN={secure:'Secure',sustainable:'Sustainable',affordable:'Affordable'};
function setEA(k){const c=EACITY;$('ea-f').innerHTML=[['all','All']].concat(Object.entries(EAN)).map(([x,n])=>`<button class=&quot;${k===x?'on':''}&quot; onclick=&quot;setEA('${x}')&quot;>${n}</button>`).join('');
  const cats=k==='all'?Object.keys(EAN):[k];
  $('ea-list').innerHTML=cats.map(ct=>`<div class=&quot;eacat&quot;><b>${EAN[ct]} energy</b>${(c.ea[ct]||[]).length?c.ea[ct].map(([n,v])=>`<div class=&quot;srow&quot;>${n} <b>${v}</b></div>`).join(''):'<div class=&quot;srow&quot; style=&quot;color:var(--muted)&quot;>No indicator reported in this category</div>'}</div>`).join('');}
/* ---- best / worst performing sectors: diverging bars ---- */
function sectorChange(c){const rows=c.sectors.map(([n,v],i)=>{const b=c.sb[i];return {n,d:(v===null||b===null)?null:Math.round((v-b)/b*100)};});
  const ok=rows.filter(r=>r.d!==null).sort((a,b)=>a.d-b.d);const mx=Math.max(...ok.map(r=>Math.abs(r.d)),10);
  const best=ok[0],worst=ok[ok.length-1];
  return ok.concat(rows.filter(r=>r.d===null)).map(r=>{if(r.d===null)return `<div class=&quot;dv&quot;><span>${r.n}</span><div class=&quot;dvt&quot;><i class=&quot;mid&quot;></i></div><span class=&quot;v&quot;><span class=&quot;pill grey&quot;>Withheld</span></span></div>`;
    const w=Math.abs(r.d)/mx*50,neg=r.d<0;
    return `<div class=&quot;dv&quot;><span>${r.n}${r===best?(r.d<0?' <span class=&quot;pill ok&quot;>Improving most</span>':' <span class=&quot;pill warn&quot;>Rising least</span>'):r===worst&amp;&amp;ok.length>1?(r.d<0?' <span class=&quot;pill warn&quot;>Improving least</span>':' <span class=&quot;pill bad&quot;>Rising most</span>'):''}</span><div class=&quot;dvt&quot;><i class=&quot;mid&quot;></i><i class=&quot;bar ${neg?'neg':'pos'}&quot; style=&quot;${neg?`right:50%`:`left:50%`};width:${w}%&quot;></i></div><span class=&quot;v ${neg?'c-ok':'c-bad'}&quot;>${neg?'↓':'↑'} ${Math.abs(r.d)}%</span></div>`;}).join('')
   +`<div class=&quot;note&quot;>Falling bars point left. Each sector is compared with its own ${c.series.find(p=>p[1]!==null)[0]} value.</div>`;}
/* ---- regional benchmark: anonymous distribution ---- */
function benchmark(c){const peers=CITIES.filter(x=>x.rel&amp;&amp;x.reg===c.reg);const chgOf=x=>x.gen?x.chg:(()=>{const b=x.series.find(p=>p[1]!==null)[1];return Math.round((x.em-b)/b*100);})();
  if(peers.length<3)return `<div class=&quot;card empty&quot; style=&quot;margin:0;padding:16px 18px&quot;><b style=&quot;font-size:14px&quot;>Not enough cities to compare yet</b><p class=&quot;note&quot; style=&quot;margin:6px 0 0&quot;>${peers.length} ${peers.length===1?'city has':'cities have'} released a report in ${REG[c.reg].n}. A regional comparison appears once at least 3 cities have.</p></div>`;
  const chg=chgOf;
  const strip=(title,vals,mine,fmt,note)=>{const s=[...vals].sort((a,b)=>a-b),mn=s[0],mxv=s[s.length-1],md=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;
    const W=460,pl=14,pr=14,xs=v=>pl+(v-mn)/((mxv-mn)||1)*(W-pl-pr);
    let g=`<svg class=&quot;chart&quot; viewBox=&quot;0 0 ${W} 74&quot;><line x1=&quot;${pl}&quot; x2=&quot;${W-pr}&quot; y1=&quot;40&quot; y2=&quot;40&quot; stroke=&quot;#E5E7EB&quot; stroke-width=&quot;8&quot; stroke-linecap=&quot;round&quot;/>`;
    s.forEach(v=>g+=`<circle cx=&quot;${xs(v)}&quot; cy=&quot;40&quot; r=&quot;4&quot; fill=&quot;#C9D6D1&quot;/>`);
    g+=`<line x1=&quot;${xs(md)}&quot; x2=&quot;${xs(md)}&quot; y1=&quot;30&quot; y2=&quot;50&quot; stroke=&quot;#6B7280&quot; stroke-width=&quot;2&quot;/><text x=&quot;${xs(md)}&quot; y=&quot;66&quot; font-size=&quot;11&quot; fill=&quot;#6B7280&quot; text-anchor=&quot;middle&quot;>Region median ${fmt(md)}</text>`;
    g+=`<circle cx=&quot;${xs(mine)}&quot; cy=&quot;40&quot; r=&quot;8&quot; fill=&quot;#0F6B58&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/><text x=&quot;${Math.min(Math.max(xs(mine),60),W-60)}&quot; y=&quot;18&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#0F6B58&quot; text-anchor=&quot;middle&quot;>${c.n} ${fmt(mine)}</text>`;
    g+=`<text x=&quot;${pl}&quot; y=&quot;66&quot; font-size=&quot;10.5&quot; fill=&quot;#9CA3AF&quot;>${fmt(mn)}</text><text x=&quot;${W-pr}&quot; y=&quot;66&quot; font-size=&quot;10.5&quot; fill=&quot;#9CA3AF&quot; text-anchor=&quot;end&quot;>${fmt(mxv)}</text></svg>`;
    return `<div style=&quot;margin-top:6px&quot;><div style=&quot;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:500&quot;><span>${title}</span><span class=&quot;note&quot; style=&quot;margin:0&quot;>${note}</span></div>${g}</div>`;};
  return strip('Emissions per capita',peers.map(x=>x.pc),c.pc,v=>v.toFixed(1)+' t','lower is better')
    +strip('Change since plan baseline',peers.map(chg),chg(c),v=>(v<0?'−':'+')+Math.abs(Math.round(v))+'%','further left is a larger cut')
    +`<div class=&quot;note&quot;>Distribution of the ${peers.length} cities in ${REG[c.reg].n} that released a report. Other cities are shown only as points.</div>`;}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo({top:0});}
function home(){go('p0');drawMap();drawList();}

drawFilters();drawAggBar();drawAgg();fitView();drawMap();drawList();initMapNav();window.addEventListener('resize',()=>drawMap());
</script>
